<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GG's Arcade Hub</title>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        h1 { color: #00ffcc; margin-top: 20px; }
        .grid { display: flex; justify-content: center; gap: 15px; margin-top: 30px; flex-wrap: wrap; }
        .btn { background: #222; border: 2px solid #333; color: white; padding: 15px 25px; font-size: 18px; border-radius: 8px; cursor: pointer; text-decoration: none; font-weight: bold; }
        .btn:hover { border-color: #00ffcc; background: #1a1a1a; }
        iframe { width: 100%; max-width: 900px; height: 600px; border: 3px solid #00ffcc; border-radius: 12px; margin-top: 20px; display: none; background: black; }
    </style>
</head>
<body>

    <h1>GG's Arcade Hub</h1>
    <p>Click a game to play it instantly:</p>

    <!-- Buttons that load the GN Math games -->
    <div class="grid">
        <button class="btn" onclick="play('drive-mad')">🚗 Drive Mad</button>
        <button class="btn" onclick="play('flappy-dunk')">🏀 Flappy Dunk</button>
        <button class="btn" onclick="play('retro-bowl')">🏈 Retro Bowl</button>
    </div>

    <!-- The game viewer window -->
    <iframe id="game-viewer"></iframe>

    <script>
        function play(gameName) {
            var viewer = document.getElementById('game-viewer');
            // This pulls the live game engine directly from GN Math's code core
            viewer.src = 'https://github.io' + gameName;
            viewer.style.display = 'inline-block';
        }
    </script>

</body>
</html>
